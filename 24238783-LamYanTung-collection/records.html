<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Record Card</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    /* Error Message Styles */
    .error-container {
      font-family: "Courier New", Courier, monospace;
      font-size: 1rem;
      color: #b91c1c;
      background-color: #fef2f2;
      border: 1px solid #fca5a5;
      padding: 16px 24px;
      border-radius: 6px;
      text-align: center;
    }

    /* Outer wrapper defining stage perspective */
    .card-stage {
      position: relative;
      width: 460px;
      height: 540px;
      perspective: 1000px;
    }

    /* Completion Message View */
    .completion-message {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: #4b5563;
      opacity: 0;
      transition: opacity 0.8s ease 0.3s;
      pointer-events: none;
    }

    .completion-message.show {
      opacity: 1;
      pointer-events: auto;
    }

    .completion-message h2 {
      font-size: 1.5rem;
      color: #111827;
      margin-bottom: 8px;
    }

    .completion-message p {
      font-size: 0.95rem;
      color: #6b7280;
    }

    /* Container for 3D card */
    .card-container {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.6s ease;
    }

    /* Card slide down animation state */
    .card-container.slide-down {
      transform: translateY(120vh);
      opacity: 0;
    }

    /* Card slide in animation state */
    .card-container.slide-in {
      animation: slideInFromTop 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes slideInFromTop {
      from {
        transform: translateY(-120vh);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    /* Card wrapper that rotates */
    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Flipped state */
    .card.is-flipped {
      transform: rotateY(180deg);
    }

    /* Shared face styles */
    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      padding: 24px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    /* FRONT FACE */
    .card-front {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    /* Dynamic Media Display Box */
    .media-container {
      width: 100%;
      height: 260px;
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .media-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .media-container audio {
      width: 85%;
    }

    .text-media-content {
      padding: 16px;
      width: 100%;
      height: 100%;
      overflow-y: auto;
      font-family: Georgia, serif;
      font-size: 0.95rem;
      line-height: 1.6;
      color: #334155;
      background-color: #fefcf8;
      border-radius: 8px;
      white-space: pre-wrap;
    }

    .content {
      text-align: center;
      width: 100%;
      margin: 12px 0;
    }

    .title {
      font-size: 1.35rem;
      font-weight: 600;
      color: #111827;
      margin-bottom: 4px;
    }

    .place-text {
      font-size: 0.85rem;
      color: #6b7280;
      font-weight: 400;
    }

    .btn {
      width: 100%;
      padding: 12px;
      background-color: #3b82f6;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn:hover {
      background-color: #2563eb;
    }

    /* BACK FACE: Archival Specimen Label */
    .card-back {
      transform: rotateY(180deg);
      background-color: #faf9f6;
      padding: 16px;
      display: flex;
      flex-direction: column;
      cursor: pointer;
    }

    .specimen-label {
      border: 1px solid #374151;
      height: 100%;
      padding: 20px;
      font-family: "Courier New", Courier, monospace;
      color: #1f2937;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-radius: 4px;
      pointer-events: none;
    }

    .specimen-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #374151;
      padding-bottom: 8px;
      margin-bottom: 14px;
    }

    .specimen-header .archive-title {
      font-size: 0.75rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .specimen-id {
      font-size: 0.85rem;
      font-weight: bold;
    }

    .field-group {
      margin-bottom: 10px;
    }

    .field-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #4b5563;
      margin-bottom: 2px;
      font-weight: bold;
    }

    .field-value {
      font-size: 0.8rem;
      color: #111827;
      line-height: 1.3;
      border-bottom: 1px dotted #d1d5db;
      padding-bottom: 2px;
    }
  </style>
</head>
<body>

  <div class="card-stage" id="cardStage">
    <!-- Completion View -->
    <div class="completion-message" id="completionMessage">
      <h2>All records archived</h2>
      <p>No remaining cards in the queue.</p>
    </div>
  </div>

  <script>
    let recordsData = [];
    let currentIndex = 0;

    async function loadRecords() {
      try {
        const response = await fetch('records.json');
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        
        if (!data.records || data.records.length === 0) {
          throw new Error('No records found in JSON');
        }
        
        recordsData = data.records;
        renderCard(currentIndex);
      } catch (error) {
        showErrorPage();
      }
    }

    function showErrorPage() {
      document.body.innerHTML = `
        <div class="error-container">
          records.json did not load. Are you serving the folder? Open http://localhost:8000
        </div>
      `;
    }

    function createMediaElement(record) {
      if (record.type === 'image') {
        return `<img src="${record.file}" alt="${record.title}" onerror="this.onerror=null; this.src='https://via.placeholder.com/400x260?text=Image+Not+Found';">`;
      } else if (record.type === 'sound') {
        return `
          <audio controls>
            <source src="${record.file}" type="audio/mpeg">
            Your browser does not support the audio element.
          </audio>
        `;
      } else if (record.type === 'text') {
        return `<div class="text-media-content" id="textContent-${record.id}">Loading text...</div>`;
      }
      return `<div>Unsupported media type</div>`;
    }

    async function loadTextFile(filePath, elementId) {
      const el = document.getElementById(elementId);
      if (!el) return;
      try {
        const res = await fetch(filePath);
        if (!res.ok) throw new Error('Could not fetch text file');
        const text = await res.text();
        el.textContent = text;
      } catch (e) {
        el.textContent = "Error loading text file content.";
      }
    }

    function renderCard(index) {
      const record = recordsData[index];
      const stage = document.getElementById('cardStage');

      const container = document.createElement('div');
      container.className = 'card-container' + (index > 0 ? ' slide-in' : '');

      const mediaHtml = createMediaElement(record);

      container.innerHTML = `
        <div class="card">
          <!-- Front Face -->
          <div class="card-face card-front">
            <div class="media-container">
              ${mediaHtml}
            </div>

            <div class="content">
              <h2 class="title">${record.title}</h2>
              <p class="place-text">${record.place}</p>
            </div>

            <button class="btn archive-btn">Archive this</button>
          </div>

          <!-- Back Face (Archival Specimen Label) -->
          <div class="card-face card-back">
            <div class="specimen-label">
              <div class="specimen-header">
                <span class="archive-title">ARCHIVAL RECORD</span>
                <span class="specimen-id">${record.id}</span>
              </div>

              <div class="field-group">
                <div class="field-label">Title</div>
                <div class="field-value">${record.title}</div>
              </div>

              <div class="field-group">
                <div class="field-label">Date and Place</div>
                <div class="field-value">${record.date} / ${record.place}</div>
              </div>

              <div class="field-group">
                <div class="field-label">Recorder</div>
                <div class="field-value">${record.recorder}</div>
              </div>

              <div class="field-group">
                <div class="field-label">What was Not Captured</div>
                <div class="field-value">${record.not_captured}</div>
              </div>

              <div class="field-group">
                <div class="field-label">Certainty</div>
                <div class="field-value">${record.certainty} / 5</div>
              </div>
            </div>
          </div>
        </div>
      `;

      stage.appendChild(container);

      // Fetch text file content if card type is text
      if (record.type === 'text') {
        loadTextFile(record.file, `textContent-${record.id}`);
      }

      attachCardEvents(container);
    }

    function attachCardEvents(container) {
      const btn = container.querySelector('.archive-btn');
      const card = container.querySelector('.card');
      const cardBack = container.querySelector('.card-back');

      // 1. Click button to flip card
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        card.classList.add('is-flipped');
      }, { once: true });

      // 2. Click anywhere on back face to slide down
      cardBack.addEventListener('click', () => {
        container.classList.add('slide-down');

        currentIndex++;

        if (currentIndex < recordsData.length) {
          renderCard(currentIndex);
        } else {
          document.getElementById('completionMessage').classList.add('show');
        }

        setTimeout(() => {
          container.remove();
        }, 600);
      }, { once: true });
    }

    // Initialize application
    loadRecords();
  </script>

</body>
</html>
