<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archival Specimen Record</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: #f4f5f7;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Error Message Overlay Styling */
    .error-message {
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.95rem;
      color: #1a1a1a;
      background-color: #ffffff;
      padding: 24px 32px;
      border: 1px solid #1a1a1a;
      border-radius: 6px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    /* 3D Scene Wrapper */
    .card-container {
      width: 460px;
      height: 520px;
      perspective: 1000px;
    }

    /* Inner Flipping Object */
    .card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
    }

    /* Trigger Class for JS Flip */
    .card-container.flipped .card-inner {
      transform: rotateY(180deg);
    }

    /* Shared Card Face Styles */
    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      padding: 24px;
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Front Face Styles */
    .card-front {
      z-index: 2;
      align-items: center;
    }

    .image-container {
      width: 100%;
      height: 260px;
      background-color: #e2e8f0;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #64748b;
      font-weight: 500;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .image-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .title {
      font-size: 1.4rem;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 6px;
      text-align: center;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #64748b;
      text-align: center;
      margin-bottom: auto;
    }

    .archive-btn {
      width: 100%;
      padding: 12px;
      background-color: #0f172a;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .archive-btn:hover {
      background-color: #334155;
    }

    /* Back Face (Archival Specimen Label) */
    .card-back {
      transform: rotateY(180deg);
      font-family: 'Courier New', Courier, monospace;
      color: #1a1a1a;
      background-color: #fcfbf9;
      padding: 20px;
    }

    /* Sharp Border Container */
    .specimen-label-border {
      border: 1px solid #1a1a1a;
      height: 100%;
      padding: 20px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Sharp Catalog Header */
    .catalog-number {
      font-size: 0.85rem;
      font-weight: bold;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border-bottom: 1px solid #1a1a1a;
      padding-bottom: 10px;
      margin-bottom: 14px;
      color: #1a1a1a;
    }

    .field-group {
      margin-bottom: 10px;
    }

    /* Sharp Field Label */
    .field-label {
      font-size: 0.75rem;
      font-weight: bold;
      text-transform: uppercase;
      color: #1a1a1a;
      margin-bottom: 2px;
      display: block;
    }

    /* Base Initial State for Field Values */
    .field-value {
      font-size: 0.82rem;
      line-height: 1.35;
      color: #1a1a1a;
      opacity: 1;
      filter: blur(0px);
      letter-spacing: 0em;
      transition-property: opacity, filter, letter-spacing;
      transition-duration: 15s;
      transition-timing-function: linear, ease-out, ease-out;
      transition-delay: 0s;
      will-change: opacity, filter, letter-spacing;
    }

    /* Late Decay for "What was not captured" value */
    .field-value.slow-decay {
      transition-duration: 4s;
      transition-delay: 11s;
    }

    .field-group.flexible {
      flex: 1;
      display: flex;
      flex-direction: column;
      margin-bottom: 0;
    }

    .field-group.flexible .field-value {
      border-top: 1px dashed #aaa;
      padding-top: 6px;
      height: 100%;
    }

    /* Decay Target State when flipped */
    .card-container.flipped .field-value {
      opacity: 0.05;
      filter: blur(6px);
      letter-spacing: 0.35em;
    }
  </style>
</head>
<body>

  <div class="card-container" id="cardContainer">
    <div class="card-inner">
      
      <!-- Front Face -->
      <div class="card-face card-front">
        <div class="image-container" id="frontImageContainer">
          <span>Loading image...</span>
        </div>
        <h2 class="title" id="frontTitle">Loading...</h2>
        <p class="subtitle" id="frontPlace">Loading place...</p>
        <button class="archive-btn" id="archiveBtn">Archive this</button>
      </div>

      <!-- Back Face (Archival Specimen Label) -->
      <div class="card-face card-back">
        <div class="specimen-label-border">
          <div class="catalog-number" id="backCatalog">CATALOG NO. --</div>
          
          <div class="field-group">
            <span class="field-label">Title</span>
            <div class="field-value" id="backTitle">--</div>
          </div>

          <div class="field-group">
            <span class="field-label">Date and place</span>
            <div class="field-value" id="backDatePlace">--</div>
          </div>

          <div class="field-group">
            <span class="field-label">Recorded by</span>
            <div class="field-value" id="backRecorder">--</div>
          </div>

          <div class="field-group">
            <span class="field-label">Certainty</span>
            <div class="field-value" id="backCertainty">--</div>
          </div>

          <div class="field-group flexible">
            <span class="field-label">What was not captured</span>
            <div class="field-value slow-decay" id="backNotCaptured">--</div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    const cardContainer = document.getElementById('cardContainer');
    const archiveBtn = document.getElementById('archiveBtn');

    // Flip interaction
    archiveBtn.addEventListener('click', () => {
      cardContainer.classList.add('flipped');
    });

    // Fetch and populate record data from record.json
    async function loadRecordData() {
      try {
        const response = await fetch('./record.json');
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        const data = await response.json();

        // Populate Front Face
        document.getElementById('frontTitle').textContent = data.title || 'Untitled Record';
        document.getElementById('frontPlace').textContent = data.place || 'Unknown Place';
        
        const frontImageContainer = document.getElementById('frontImageContainer');
        if (data.image) {
          frontImageContainer.innerHTML = `<img src="${data.image}" alt="${data.title || 'Record Image'}">`;
        } else {
          frontImageContainer.innerHTML = `<span>No Image Available</span>`;
        }

        // Populate Back Face
        document.getElementById('backCatalog').textContent = `CATALOG NO. ${data.catalog_id || 'UNKNOWN'}`;
        document.getElementById('backTitle').textContent = data.title || 'Untitled';
        
        const datePlaceStr = [data.date, data.place].filter(Boolean).join(' — ');
        document.getElementById('backDatePlace').textContent = datePlaceStr || 'Unknown';
        
        document.getElementById('backRecorder').textContent = data.recorder || 'Unknown';
        document.getElementById('backCertainty').textContent = data.certainty !== undefined ? data.certainty : 'Unspecified';
        document.getElementById('backNotCaptured').textContent = data.not_captured || 'None specified.';

      } catch (error) {
        console.error('Failed to load record.json:', error);
        // Replace page contents with the specified monospace error message
        document.body.innerHTML = '<div class="error-message">record.json did not load. Are you serving the folder?</div>';
      }
    }

    loadRecordData();
  </script>

</body>
</html>
